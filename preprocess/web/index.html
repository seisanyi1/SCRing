<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WellPrep · 绿色亮圆预处理</title>
  <link rel="stylesheet" href="/static/app.css?v=14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='%2310b981'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%230b1524'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/new">
        <span class="brand-mark"><span></span></span>
        <span class="brand-text">
          <strong>WellPrep</strong>
          <small>绿色亮圆预处理</small>
        </span>
      </a>

      <nav class="tree" id="side-tree">
        <div class="tree-group open" data-group="extract">
          <button class="tree-head" type="button">
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            <span class="g-name">圆域提取</span>
            <em id="nav-run-count" class="nav-count"></em>
          </button>
          <div class="tree-body">
            <a href="#/new" data-nav="new">新建提取</a>
            <a href="#/runs" data-nav="runs">提取记录</a>
          </div>
        </div>

        <div class="tree-group open" data-group="cut">
          <button class="tree-head" type="button">
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            <span class="g-name">圆域切割</span>
            <em id="nav-cut-count" class="nav-count"></em>
          </button>
          <div class="tree-body">
            <a href="#/cut" data-nav="cut">新建切割</a>
            <a href="#/cuts" data-nav="cuts">切割记录</a>
          </div>
        </div>
      </nav>

      <div class="sidebar-foot">
        <span class="dot" id="server-dot"></span>
        <span id="server-line">本地服务</span>
      </div>
    </aside>

    <main class="main">
      <div id="view" class="view">
        <div class="loading-card"><span class="spinner"></span> 正在加载…</div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/static/app.js?v=14"></script>
</body>
</html>
